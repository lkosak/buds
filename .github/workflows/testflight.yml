# Deploy to TestFlight
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions):
#
#   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect API key
#   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID from App Store Connect API key
#   APP_STORE_CONNECT_API_KEY     — Contents of the .p8 private key file
#   DEVELOPMENT_TEAM              — Your Apple Developer Team ID (e.g. ABC123DEF4)
#   MATCH_PASSWORD                — Passphrase used to encrypt the certificates repo
#   MATCH_GIT_BASIC_AUTHORIZATION — base64 of "username:ghp_token" for the certificates repo
#
# ONE-TIME SETUP (run locally, not in CI):
#
#   1. Create a private GitHub repo: github.com/lkosak/certificates
#
#   2. Initialize Match (run from this repo):
#        bundle exec fastlane match init
#        # storage_mode: git
#        # URL: https://github.com/lkosak/certificates
#
#   3. Create certs and provisioning profile for this app:
#        bundle exec fastlane match appstore --app_identifier io.lou.app
#      Match will create a distribution cert + App Store profile, encrypt them,
#      and push to the certificates repo. For future apps, just run this with their bundle ID.
#
#   4. Generate a GitHub Personal Access Token (repo scope) for CI to clone the
#      certificates repo, then base64-encode it:
#        echo -n "lkosak:ghp_yourtoken" | base64
#      Store the result as the MATCH_GIT_BASIC_AUTHORIZATION secret.
#
#   App Store Connect API key (for uploading to TestFlight):
#     1. Go to appstoreconnect.apple.com → Users and Access → Integrations → App Store Connect API
#     2. Create a new key with "App Manager" role — download the .p8 file
#     3. Note the Key ID and Issuer ID shown on that page
#     4. APP_STORE_CONNECT_API_KEY = the full text content of the .p8 file
#
#   DEVELOPMENT_TEAM = your Team ID from developer.apple.com/account
#   Register the app: appstoreconnect.apple.com → Apps → + → New App
#     Bundle ID: io.lou.app  |  Name: Buds

name: Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
