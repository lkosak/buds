# Deploy to TestFlight
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions):
#
#   APP_STORE_CONNECT_KEY_ID      — Key ID from App Store Connect API key
#   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID from App Store Connect API key
#   APP_STORE_CONNECT_API_KEY     — Contents of the .p8 private key file
#   DEVELOPMENT_TEAM              — Your Apple Developer Team ID (e.g. ABC123DEF4)
#   BUILD_CERTIFICATE_BASE64      — Base64-encoded .p12 distribution certificate
#   P12_PASSWORD                  — Password for the .p12 certificate
#   BUILD_PROVISION_PROFILE_BASE64 — Base64-encoded .mobileprovision file
#
# HOW TO GET THESE (requires Apple Developer Program membership, $99/year):
#
#   App Store Connect API key (for uploading to TestFlight):
#     1. Go to appstoreconnect.apple.com → Users and Access → Integrations → App Store Connect API
#     2. Create a new key with "App Manager" role — download the .p8 file
#     3. Note the Key ID and Issuer ID shown on that page
#     4. APP_STORE_CONNECT_API_KEY = the full text content of the .p8 file
#
#   Signing certificate (for code signing the build):
#     1. In Xcode: Settings → Accounts → your team → Manage Certificates → "+" → Apple Distribution
#     2. In Keychain Access: find "Apple Distribution" cert → right-click → Export as .p12
#     3. BUILD_CERTIFICATE_BASE64 = run: base64 -i Certificates.p12 | pbcopy
#     4. P12_PASSWORD = the password you set when exporting
#
#   Provisioning profile:
#     1. Go to developer.apple.com → Certificates, Identifiers & Profiles → Profiles
#     2. Create an "App Store Connect" profile for bundle ID io.lou.app
#     3. BUILD_PROVISION_PROFILE_BASE64 = run: base64 -i profile.mobileprovision | pbcopy
#
#   Other:
#     DEVELOPMENT_TEAM = your Team ID from developer.apple.com/account
#     Register the app: appstoreconnect.apple.com → Apps → + → New App
#       Bundle ID: io.lou.app  |  Name: Buds

name: Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Write App Store Connect API key file
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: echo "$APP_STORE_CONNECT_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta

      - name: Clean up signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision"
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
